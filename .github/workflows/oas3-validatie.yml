name: OAS3-validatie

on:
  pull_request:
  workflow_dispatch: {}

jobs:
  lint:
    name: Valideer tegen OpenAPI 3.0-standaard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installeer tools uit mise.toml
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5

      - name: Lint met Redocly CLI (OpenAPI 3.0-conformiteit)
        run: mise run validate-oas-spec
